<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EveAssets: character &amp; corporation assets</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Eve<b>Assets</b></div>
    <div id="status" class="status" aria-live="polite"></div>
    <label class="field">Prices
      <select id="priceMode">
        <option value="jita_sell">Jita sell (lowest)</option>
        <option value="jita_buy">Jita buy (highest)</option>
        <option value="esi_avg">ESI average</option>
      </select>
    </label>
    <button id="refreshBtn">Refresh</button>
    <button id="addBtn" class="primary">Add character</button>
  </header>

  <div id="setup" class="banner" hidden>
    <b>Setup needed:</b> register an application at developers.eveonline.com and paste its Client ID into <code>config.js</code>. See README.md.
  </div>

  <div class="layout">
    <aside>
      <h2>Owners</h2>
      <div id="owners"></div>
      <p class="hint">Corporation assets show up automatically for any logged-in character with the <b>Director</b> role.</p>
      <p class="hint">Logins and cached assets are stored only in this browser.</p>
    </aside>

    <main>
      <section id="stats" class="stats"></section>
      <section class="filters">
        <input id="search" type="search" placeholder="Search items, ship or container names, locations…" autocomplete="off">
        <select id="locationFilter"></select>
        <select id="divisionFilter" hidden></select>
        <label class="field">Group
          <select id="groupBy">
            <option value="location">By location</option>
            <option value="type">By item type</option>
            <option value="none">No grouping</option>
          </select>
        </label>
        <label class="field" id="locSortField">Sort locations
          <select id="locSort">
            <option value="value_desc">Most ISK first</option>
            <option value="value_asc">Least ISK first</option>
            <option value="stacks_desc">Most item stacks</option>
            <option value="name_asc">Name A–Z</option>
          </select>
        </label>
        <button id="exportBtn">Export CSV</button>
      </section>
      <div id="notice"></div>
      <div id="content"></div>
    </main>
  </div>

  <div id="toasts"></div>
</body>
</html>
